name: Check pull request

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm CLI (not pre-installed on runners by default)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Set Node.js version and cache pnpm store for faster builds
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Ensures exact versions are installed without updating pnpm-lock.yaml in CI
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Type-check and Build
        run: pnpm build

      - name: Test vitest
        run: pnpm test
